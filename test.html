<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Business + Event Data Capture</title>
  <link rel="stylesheet" type="text/css" href="css/ThatStyle.css">
    <script src="js/script.js"></script>
</head>
<body style="background: linear-gradient(white, #ff3c00ad);">
   <header style="width:100%;" id="#">
        <a onclick="showNewNotifications()" style="font-size: 25px;"><i class='bx bxs-bell'></i></a>
        <center><a href=#><img src="https://see.fontimg.com/api/renderfont4/p72nK/eyJyIjoiZnMiLCJoIjo4MSwidyI6MTI1MCwiZnMiOjY1LCJmZ2MiOiIjMDAwMDAwIiwiYmdjIjoiI0ZGRkZGRiIsInQiOjF9/bUZPQ0FO/dripinkpersonaluse-black.png" alt="Dripping fonts"></a>
         <strong><p style="color: black">System Integrations</p></strong>
        </center>

    </header>
  <center>
  <h1>Business Details</h1>
  <form id="fullForm" class="business-menu" action="http://localhost:5000/api/full-form-submit" method="POST">

    <!-- tblBusiness -->
    <fieldset  style="padding-bottom: 30px; width: 80%; border:none;">
      <h2>Business</h2>
      <input name="BusinessName" class="menu-input" placeholder="Business Name" required><br></br>
      <input name="BusinessImgURL" class="menu-input" placeholder="Business Image URL"><br></br>
      <input name="Address" class="menu-input" placeholder="Address"><br></br>
      <input name="Email" class="menu-input" placeholder="Email" type="email"><br></br>
      <input name="CallNumber" class="menu-input" placeholder="Call Number"><br></br>
      <input name="Scheduling" class="menu-input" placeholder="Scheduling info"><br></br>
    </fieldset>

    <!-- tblBusinessSupply -->
    <fieldset style="padding-bottom: 30px; width: 80%; border:none;">
      <h2>Business Supply</h2>
      <input name="BusinessSupplyName" placeholder="Supply Name" class="menu-input" required><br></br>
      <input name="Services" placeholder="Services" class="menu-input" required><br></br>
      <input name="OpenFrom" type="time" placeholder="Open From" class="menu-input"><br></br>
      <input name="OpenTill" type="time" placeholder="Open Till" class="menu-input">
      <h2>Days Open:</h2>
       </center>
      <label><input type="checkbox" name="Monday" class="menu-input"> Monday</label><br>
      <label><input type="checkbox" name="Tuesday" class="menu-input"> Tuesday</label><br>
      <label><input type="checkbox" name="Wednesday" class="menu-input"> Wednesday</label><br>
      <label><input type="checkbox" name="Thursday" class="menu-input"> Thursday</label><br>
      <label><input type="checkbox" name="Friday" class="menu-input"> Friday</label><br>
      <label><input type="checkbox" name="Saturday" class="menu-input"> Saturday</label><br>
      <label><input type="checkbox" name="Sunday" class="menu-input"> Sunday</label><br>
    </fieldset>
    <center>

    <!-- tblMenuPriceList -->
    <fieldset style="padding-bottom: 30px; width: 80%; border:none;">
      <h2>Menu Price List</h2>
      <input name="ItemName" placeholder="Item Name" class="menu-input"><br></br>
      <input name="Description" placeholder="Item Description" class="menu-input"><br></br>
      <input name="Price" placeholder="Price" type="number" step="0.01" class="menu-input"><br></br>
    </fieldset>

    <!-- tblEvent -->
    <fieldset style="padding-bottom: 30px; width: 80%; border:none;">
      <h2>Event</h2>
      <input name="EventName" placeholder="Event Name" class="menu-input"><br></br>
      <input name="EventType" placeholder="Event Type (e.g., Concert)" class="menu-input"><br></br>
      <input name="ArtistName" placeholder="Main Artist Name" class="menu-input"><br></br>
      <input name="EventDate" type="date" class="menu-input"><br></br>
      <input name="EventTime" type="time" class="menu-input"><br></br>
      <input name="EventDescription" placeholder="Event Description" class="menu-input"><br></br>
    </fieldset>

    <!-- tblEventBooking -->
    <fieldset style="padding-bottom: 30px; width: 80%; border:none;">
      <h2>Event Booking</h2>
      <input name="TicketPrice" placeholder="Ticket Price" type="number" step="0.01"class="menu-input"><br></br>
      <input name="BookingStatus" placeholder="Booking Status (e.g., available, sold out)" class="menu-input"><br></br>
    </fieldset>

    <!-- tblArtist -->
    <fieldset style="padding-bottom: 30px; width: 80%; border:none;">
      <h2>Artist</h2>
      <input name="ArtistName2" placeholder="Artist Name" class="menu-input"><br></br>
      <input name="ArtistImgURL" placeholder="Artist Image URL" class="menu-input"><br></br>
      <input name="ArtistDescription" placeholder="Description" class="menu-input"><br></br>
    </fieldset>

    <button type="submit" class="menu-button">Submit All Data</button>
  </form>
  </center>
 

  <script>
    const form = document.getElementById('fullForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      // Convert checkbox fields to booleans
      ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].forEach(day => {
        data[day] = formData.has(day);
      });

      const response = await fetch('http://localhost:5000/api/full-form-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const result = await response.json();
      alert(result.success ? '✔ Data submitted' : '❌ Submission failed');
    });
  </script>
</body>
</html>
