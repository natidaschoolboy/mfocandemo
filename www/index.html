<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFOCAN</title>
    <link rel="icon" type="image/jpeg" href="logo.jpeg">
    <link rel="stylesheet" type="text/css" href="css/ThatStyle.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* Smooth Fade & Center Styles */
        #splash-screen {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background-color: #000000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.6s ease-in-out;
        }

        #splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 16px;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        #splash-logo {
            max-width: 180px; 
            max-height: 180px; 
            object-fit: contain; 
        }

        .splash-text {
            color: #9ca3af;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin: 0;
            text-align: center;
        }
    </style>
</head>
<body style="background-color: white; margin: 0; padding: 0;">

    <!-- Smooth Splash Overlay -->
    <div id="splash-screen">
        <div id="splash-content">
            <img id="splash-logo" src="mfocan logo.jpeg" alt="MFOCAN Logo">
            <p class="splash-text">Loading waiting for network...</p>
        </div>
    </div>

    <!-- Main Content Container -->
    <div id="bodycontent"></div>

    <!-- Script Execution -->
    <script src="config/config.js"></script>
    <script src="js/script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const splashScreen = document.getElementById('splash-screen');
            const splashContent = document.getElementById('splash-content');

            // 1. Fade in Logo & Centered Text after 1 second
            setTimeout(() => {
                if (splashContent) splashContent.style.opacity = '1';
            }, 1000);

            // 2. Render content and smoothly fade out Splash Screen after 2 seconds total
            setTimeout(() => {
                // Execute layout render
                if (typeof mainPageContent === 'function') {
                    mainPageContent();
                } else console.error("mainPageContent function missing from js/script.js");

                // Trigger smooth fade out
                if (splashScreen) {
                    splashScreen.style.opacity = '0';
                    
                    // Remove overlay from pointer interactions after fade completes
                    setTimeout(() => {
                        splashScreen.style.display = 'none';
                    }, 600);
                }
            }, 2000);
        });
    </script>
</body>
</html>
